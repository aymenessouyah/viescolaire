<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Parcours de l’Agent Vie Scolaire AI</title>
  <desc id="desc">Le professeur se connecte, prépare une demande, Supabase vérifie la session avant l’appel Gemini, puis compare et valide le résultat. Pour les documents libres, la confirmation enregistre des versions locales restaurables sans modifier le fichier externe. Chaque document reçoit son lycée, son enseignant et sa classe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9faf6"/><stop offset="1" stop-color="#edf3ed"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143d30"/><stop offset="1" stop-color="#2b7659"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc477"/><stop offset="1" stop-color="#b18836"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#183c2d" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4c8769"/></marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0 0 5 10 10Z" fill="#4c8769"/></marker>
    <style>
      text{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
      .card{fill:#fff;stroke:#dce7dc;stroke-width:1.5}
      .num{fill:url(#brand)}
      .numText{fill:#fff;font-size:18px;font-weight:800;text-anchor:middle}
      .kicker{fill:#6b806f;font-size:13px;font-weight:800;letter-spacing:1.6px}
      .head{fill:#193c2e;font-size:22px;font-weight:750}
      .body{fill:#56675b;font-size:17px;font-weight:500}
      .pill{fill:#edf5ef;stroke:#d5e6d8;stroke-width:1}
      .pillText{fill:#276548;font-size:13px;font-weight:750}
      .line{fill:none;stroke:#4c8769;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .lineLeft{fill:none;stroke:#4c8769;stroke-width:3;stroke-linecap:round;marker-end:url(#arrowLeft)}
      .footHead{fill:#f5f8f3;stroke:#dce7dc;stroke-width:1.5}
      .footTitle{fill:#193c2e;font-size:18px;font-weight:750}
      .footText{fill:#56675b;font-size:14px;font-weight:500}
    </style>
  </defs>
  <rect width="1600" height="1020" rx="28" fill="url(#bg)"/>
  <circle cx="1475" cy="105" r="170" fill="#e4eee4" opacity=".55"/>
  <circle cx="75" cy="900" r="210" fill="#e5eee4" opacity=".5"/>
  <rect x="64" y="44" width="46" height="46" rx="15" fill="url(#brand)"/>
  <path d="m87 53 4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#f3df9d"/>
  <text x="126" y="65" class="kicker">ESPACE PÉDAGOGIQUE · SCIENCES ET TECHNOLOGIES DE L’INFORMATIQUE</text>
  <text x="64" y="137" fill="#153b2d" font-size="36" font-weight="800" letter-spacing="-1.2">Agent Vie Scolaire AI</text>
  <text x="66" y="171" fill="#65756a" font-size="17" font-weight="500">Du besoin pédagogique au document vérifié par l’enseignant</text>

  <!-- Parcours aller : professeur → formulaire → contrôle sécurisé → Gemini -->
  <g filter="url(#shadow)">
    <rect class="card" x="64" y="222" width="330" height="210" rx="20"/>
    <rect class="card" x="454" y="222" width="330" height="210" rx="20"/>
    <rect class="card" x="844" y="222" width="330" height="210" rx="20"/>
    <rect class="card" x="1234" y="222" width="302" height="210" rx="20"/>
    <rect class="card" x="1234" y="568" width="302" height="190" rx="20"/>
    <rect class="card" x="844" y="568" width="330" height="190" rx="20"/>
    <rect class="card" x="454" y="568" width="330" height="190" rx="20"/>
    <rect class="card" x="64" y="568" width="330" height="190" rx="20"/>
  </g>

  <!-- Connecteurs -->
  <path class="line" d="M400 327h39"/>
  <path class="line" d="M790 327h39"/>
  <path class="line" d="M1180 327h39"/>
  <path class="line" d="M1385 444v108"/>
  <path class="lineLeft" d="M1220 663h-39"/>
  <path class="lineLeft" d="M830 663h-39"/>
  <path class="lineLeft" d="M440 663h-39"/>

  <!-- Étapes 1 à 4 -->
  <g>
    <circle class="num" cx="101" cy="262" r="19"/><text class="numText" x="101" y="268">1</text>
    <text class="kicker" x="132" y="267">DÉPART</text>
    <text class="head" x="88" y="311">Professeur connecté</text>
    <text class="body" x="88" y="342">Se connecte à son espace,</text><text class="body" x="88" y="367">choisit une classe et un outil.</text>
    <rect class="pill" x="88" y="389" width="137" height="25" rx="12"/><text class="pillText" x="102" y="406">Compte Supabase Auth</text>
  </g>
  <g>
    <circle class="num" cx="491" cy="262" r="19"/><text class="numText" x="491" y="268">2</text>
    <text class="kicker" x="522" y="267">PRÉPARATION</text>
    <text class="head" x="478" y="311">Formulaire de l’agent</text>
    <text class="body" x="478" y="342">Fiche · cahier · exercices ·</text><text class="body" x="478" y="367">correction · répartition · document.</text>
    <text class="body" x="478" y="399" font-size="14">Les fichiers sont joints au choix.</text>
  </g>
  <g>
    <circle class="num" cx="881" cy="262" r="19"/><text class="numText" x="881" y="268">3</text>
    <text class="kicker" x="912" y="267">SÉCURITÉ</text>
    <text class="head" x="868" y="311">Vérification Supabase</text>
    <text class="body" x="868" y="342">Bearer token et session Auth</text><text class="body" x="868" y="367">vérifiés par l’Edge Function</text><text class="body" x="868" y="392">assistant-ia avant l’appel.</text>
  </g>
  <g>
    <circle cx="1271" cy="262" r="19" fill="url(#gold)"/><text class="numText" x="1271" y="268">4</text>
    <text class="kicker" x="1302" y="267">GÉNÉRATION</text>
    <text class="head" x="1258" y="311">Google Gemini</text>
    <text class="body" x="1258" y="342">Produit une proposition</text><text class="body" x="1258" y="367">structurée adaptée à la demande.</text>
    <rect class="pill" x="1258" y="389" width="195" height="25" rx="12"/><text class="pillText" x="1272" y="406">Clé gardée dans Supabase</text>
  </g>

  <!-- Étapes 5 à 8 : retour et décision -->
  <g>
    <circle class="num" cx="1271" cy="607" r="19"/><text class="numText" x="1271" y="613">5</text>
    <text class="kicker" x="1302" y="612">RÉPONSE</text>
    <text class="head" x="1258" y="655">Document structuré</text>
    <text class="body" x="1258" y="686">Le JSON est contrôlé puis</text><text class="body" x="1258" y="711">affiché dans l’aperçu.</text>
  </g>
  <g>
    <circle class="num" cx="881" cy="607" r="19"/><text class="numText" x="881" y="613">6</text>
    <text class="kicker" x="912" y="612">RELECTURE</text>
    <text class="head" x="868" y="655">L’enseignant vérifie</text>
    <text class="body" x="868" y="686">Compare la source et la proposition,</text><text class="body" x="868" y="711">puis vérifie les changements.</text>
  </g>
  <g>
    <circle class="num" cx="491" cy="607" r="19"/><text class="numText" x="491" y="613">7</text>
    <text class="kicker" x="522" y="612">DÉCISION</text>
    <text class="head" x="478" y="655">À votre initiative</text>
    <text class="body" x="478" y="686">Confirmer · exporter · imprimer</text><text class="body" x="478" y="711">ou restaurer une version locale.</text>
  </g>
  <g>
    <circle class="num" cx="101" cy="607" r="19"/><text class="numText" x="101" y="613">8</text>
    <text class="kicker" x="132" y="612">DOCUMENT FINAL</text>
    <text class="head" x="88" y="655">Identité intégrée</text>
    <text class="body" x="88" y="686">Lycée · Enseignant</text><text class="body" x="88" y="711">· Classe sur chaque document.</text>
  </g>

  <!-- Repères de sécurité et de confidentialité -->
  <rect class="footHead" x="64" y="805" width="1472" height="148" rx="18"/>
  <rect x="84" y="827" width="5" height="104" rx="2.5" fill="url(#brand)"/>
  <text class="footTitle" x="108" y="851">Sécurité et données</text>
  <text class="footText" x="108" y="881">• Chaque requête POST reste authentifiée (Bearer + vérification Supabase Auth).</text>
  <text class="footText" x="108" y="906">• Nom et lycée ajoutés dans le navigateur; non transmis à Gemini pour l’en-tête.</text>
  <text class="footText" x="820" y="881">• Seuls le contexte utile et les pièces jointes choisies sont transmis au modèle.</text>
  <text class="footText" x="820" y="906">• Le fichier externe reste inchangé; les versions locales sont restaurables.</text>
  <text x="64" y="986" fill="#829084" font-size="12" font-weight="600">Agent Vie Scolaire AI · Sciences et technologies de l’informatique</text>
  <text x="1535" y="986" fill="#829084" font-size="12" font-weight="600" text-anchor="end">Schéma de fonctionnement · 2026–2027</text>
</svg>
